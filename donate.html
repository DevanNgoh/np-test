<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate | GSSoG</title>
    <link rel="stylesheet" href="donate.css">
    <link rel="stylesheet" href="about.css">
</head>

<body>

    <header class="navbar">
        <img src="pictures/GGSoG-logo.png" class="logo" alt="GSSoG Logo">

        <div class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <nav id="navMenu">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="project.html">Project</a>
            <a href="donate.html" class="active-link">Donate</a>
        </nav>
    </header>

    <main>
        <div class="container">

            <h1>Support Our Mission</h1>

            <p class="label">Select Gift Frequency</p>

            <div class="time">
                <span class="active-option" id="monthlyBtn">Monthly</span>
                <span id="onetimeBtn">One-Time</span>
            </div>

            <p class="label">Select Amount</p>

            <div class="value">
                <span class="money selected">$12</span>
                <span class="money">$30</span>
                <span class="money">$40</span>
                <span class="money">$50</span>
                <span class="money">$60</span>
            </div>

            <div class="confirm">
                <input type="checkbox">
                <span>Yes, I'll add $0.30 to help cover transaction costs.</span>
            </div>

            <div class="input">
                <label>Name</label>
                <input type="text" placeholder="Enter your name">

                <label>Email</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <button class="donate-btn" id="donateButton">
                Donate Now
            </button>

            <p class="terms">
                By donating, you agree to our
                <a href="terms.html" class="blue">Terms of Service</a>
                and
                <a href="privacy.html" class="blue">Privacy Policy</a>.
            </p>

        </div>
    </main>

    <script>

        // Replace these with your actual Stripe Payment Links
        const monthlyLinks = {
            "$12": "https://buy.stripe.com/test_3cI8wI2le0xWfpU8DnabK00",
            "$30": "https://buy.stripe.com/test_3cI8wI2le0xWfpU8DnabK00",
            "$40": "https://buy.stripe.com/test_3cI8wI2le0xWfpU8DnabK00",
            "$50": "https://buy.stripe.com/test_3cI8wI2le0xWfpU8DnabK00",
            "$60": "https://buy.stripe.com/test_3cI8wI2le0xWfpU8DnabK00"
        };

        const oneTimeLinks = {
            "$12": "https://buy.stripe.com/test_3cI8wI2le0xWfpU8DnabK00",
            "$30": "https://buy.stripe.com/test_3cI8wI2le0xWfpU8DnabK00",
            "$40": "https://buy.stripe.com/test_3cI8wI2le0xWfpU8DnabK00",
            "$50": "https://buy.stripe.com/test_3cI8wI2le0xWfpU8DnabK00",
            "$60": "https://buy.stripe.com/test_3cI8wI2le0xWfpU8DnabK00"
        };

        let frequency = "monthly";
        let selectedAmount = "$12";

        // Select amount
        document.querySelectorAll(".money").forEach(item => {
            item.addEventListener("click", () => {

                document.querySelectorAll(".money")
                    .forEach(m => m.classList.remove("selected"));

                item.classList.add("selected");
                selectedAmount = item.textContent;
            });
        });

        // Monthly
        document.getElementById("monthlyBtn").addEventListener("click", () => {
            frequency = "monthly";

            document.getElementById("monthlyBtn")
                .classList.add("active-option");

            document.getElementById("onetimeBtn")
                .classList.remove("active-option");
        });

        // One Time
        document.getElementById("onetimeBtn").addEventListener("click", () => {
            frequency = "onetime";

            document.getElementById("onetimeBtn")
                .classList.add("active-option");

            document.getElementById("monthlyBtn")
                .classList.remove("active-option");
        });

        // Donate button
        document.getElementById("donateButton")
            .addEventListener("click", () => {

                let link;

                if (frequency === "monthly") {
                    link = monthlyLinks[selectedAmount];
                } else {
                    link = oneTimeLinks[selectedAmount];
                }

                window.location.href = link;
            });

        function toggleMenu() {
            document.getElementById("navMenu").classList.toggle("show");
            document.querySelector(".hamburger").classList.toggle("active");
        }

    </script>

</body>

</html>
